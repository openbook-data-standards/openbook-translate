[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openbook-translate"
version = "0.1.0"
description = "ABC and tools for mapping one vendor record to OpenBook documents and back (Q96)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "the OpenBook authors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: Apache Software License",
  "Typing :: Typed",
]
dependencies = [
  "jsonschema>=4.18",
  "referencing",
]

[project.urls]
Homepage = "https://github.com/openbook-data-standards/openbook-translate"
Specification = "https://github.com/openbook-data-standards/openbook"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
openbook-translate = "openbook_translate.cli:main"

[project.entry-points."openbook_translate.adapters"]
acme = "openbook_translate.acme:AcmeTranslator"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openbook_translate = [
  "schema/*.json",
  "acme.tables.json",
  "vocabularies/*",
  "openbook-spec-version",
  "openbook-spec-commit",
  "py.typed",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
